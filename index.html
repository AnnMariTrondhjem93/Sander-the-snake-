<!DOCTYPE html>
<html>
<head>
<title>Snake</title>
<style>
body { text-align:center; background:black; color:white; }
canvas { background:#111; border:2px solid white; }
</style>
</head>
<body>

<h1>Snake 🐍</h1>
<p id="score">Poeng: 0</p>
<canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake = [{x:200,y:200}];
let food = {x:100,y:100};
let dx = 20;
let dy = 0;
let score = 0;

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp") { dx=0; dy=-20; }
  if (e.key === "ArrowDown") { dx=0; dy=20; }
  if (e.key === "ArrowLeft") { dx=-20; dy=0; }
  if (e.key === "ArrowRight") { dx=20; dy=0; }
});

function draw() {
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,400,400);

  ctx.font = "18px Arial";
ctx.fillText("🍎", food.x, food.y + 18);

  let head = {x:snake[0].x+dx,y:snake[0].y+dy};

  if(head.x===food.x && head.y===food.y){
    score++;
    document.getElementById("score").innerText="Poeng: "+score;
    food={
      x:Math.floor(Math.random()*20)*20,
      y:Math.floor(Math.random()*20)*20
    };
  } else {
    snake.pop();
  }

  snake.unshift(head);

ctx.fillStyle="lime";
  snake.forEach(part=>{
    ctx.fillRect(part.x,part.y,20,20);
  });

  if(head.x<0 || head.y<0 || head.x>=400 || head.y>=400){
    alert("Game Over! Poeng: "+score);
    location.reload();
  }
}

setInterval(draw,100);
</script>

</body>
</html>
